name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Automated cask PR to validate
        required: true
      head_sha:
        description: Expected PR head SHA
        required: true

jobs:
  test-bot:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Test livecheck failure reporting
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s test -p '*_test.py' -v

      - name: Test BaoCut livecheck
        if: runner.os == 'macOS'
        run: |
          brew install-bundler-gems --add-groups=formula_test,livecheck
          brew ruby test/baocut_livecheck_test.rb

      - name: Verify cask release and all architecture downloads
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          UPDATE_PR: ${{ inputs.pull_request }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: python3 .github/scripts/bump-prs.py verify --pr "$UPDATE_PR" --sha "$EXPECTED_SHA"

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
