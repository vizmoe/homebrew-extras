name: brew bump

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:23 UTC
    - cron: "23 3 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
      - .github/scripts/check-livecheck.py
      - .github/scripts/bump-prs.py
      - .github/workflows/tests.yml
      - .github/workflows/automerge.yml

concurrency:
  group: cask-updater
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    # Cask bumps must run on macOS: Linux looks for Linux artifacts/checksums.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@main

      - name: Track cask updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: python3 .github/scripts/bump-prs.py prepare

      # brew bump-formula-pr cannot update go-grip's platform-specific URLs/checksums.
      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN || secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --casks --tap="$TAP_NAME"

      - name: Refresh pending updates and dispatch CI
        if: ${{ !cancelled() && steps.set-up-homebrew.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: python3 .github/scripts/bump-prs.py reconcile

      - name: Report upstream version checks
        if: ${{ !cancelled() && steps.set-up-homebrew.outcome == 'success' }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN || secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: python3 .github/scripts/check-livecheck.py "$TAP_NAME"
