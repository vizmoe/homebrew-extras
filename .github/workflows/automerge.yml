name: Merge verified cask updates

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions: {}

concurrency:
  group: cask-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Always load privileged code from the default branch, never from the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge only a verified current cask update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/bump-prs.py merge --run-id "$VERIFIED_RUN"
